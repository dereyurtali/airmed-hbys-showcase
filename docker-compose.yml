services:
  postgres:
    image: postgres:16-alpine
    container_name: airmed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airmed
      POSTGRES_PASSWORD: airmed_dev
      POSTGRES_DB: airmed_hbys
      # #925 — init.sh airmed_app rol parolasını buradan alır (dev default zayıf).
      AIRMED_APP_PASSWORD: ${AIRMED_APP_PASSWORD:-airmed_app_dev}
      # #916 — init.sh airmed_bg (NOSUPERUSER BYPASSRLS) rol parolası (dev default).
      AIRMED_BG_PASSWORD: ${AIRMED_BG_PASSWORD:-airmed_bg_dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U airmed -d airmed_hbys']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: airmed-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
