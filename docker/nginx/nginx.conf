# A15 PR 2 — Production nginx reverse proxy.
#
# Sorumluluk:
# - TLS terminate (Let's Encrypt wildcard SSL)
# - Tenant routing:
#     *.hbys.dnasoft.co  → web container (klinik UI)
#     admin.dnasoft.co   → admin container
# - API proxy:
#     /api/*       → api:3001
#     /platform/*  → api:3001 (global prefix exclude)
#     /sync (ws)   → api:3001 socket.io upgrade
# - Security: HSTS, X-Frame-Options, CSP relax (api kendi CSP'sini koyuyor)
# - Static asset cache: web/admin Dockerfile içinde 1y; nginx layer ek değişiklik yapmıyor

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" host=$host';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 25M; # foto upload limiti A12: 10MB; ek margin

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  # #1069 — bu config'de HER location bir proxy_pass; gzip_proxied default'u
  # `off` olduğundan bu satır olmadan HİÇBİR api/web/admin yanıtı sıkışmıyordu
  # (tRPC batch JSON'ları dahil). nginx gzip_types eşleşmesini charset'siz
  # MIME üzerinden yapar → `application/json; charset=utf-8` kapsanır.
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript
             application/xml+rss application/atom+xml image/svg+xml;

  # ---------- Common upstream'ler ----------
  upstream api_backend {
    server api:3001;
  }
  upstream web_backend {
    server web:80;
  }
  upstream admin_backend {
    server admin:80;
  }

  # ---------- HTTP → HTTPS redirect (Let's Encrypt challenge hariç) ----------
  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---------- *.hbys.dnasoft.co (klinik tenant subdomain'leri) ----------
  server {
    listen 443 ssl;
    http2 on;
    server_name ~^(?<tenant>[^.]+)\.hbys\.dnasoft\.co$ hbys.dnasoft.co;

    ssl_certificate /etc/letsencrypt/live/dnasoft.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dnasoft.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # API ve sync için backend proxy. /platform/* burada AÇIK DEĞİL —
    # tenant domain'inden platform admin'e erişim engellenir (defansif).
    location /api/ {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Slug $tenant;
      proxy_read_timeout 60s;
    }

    # A12 WebSocket gateway (/sync namespace)
    location /sync/ {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s; # long-lived ws
    }

    # Tenant UI static (apps/web container)
    location / {
      proxy_pass http://web_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ---------- admin.dnasoft.co (DNA platform admin) ----------
  server {
    listen 443 ssl;
    http2 on;
    server_name admin.dnasoft.co;

    ssl_certificate /etc/letsencrypt/live/dnasoft.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dnasoft.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Platform admin endpoint'leri /platform/* (global prefix exclude)
    location /platform/ {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # Static admin SPA
    location / {
      proxy_pass http://admin_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
